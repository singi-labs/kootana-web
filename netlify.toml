[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA-style 404 fallback is not needed (static multi-file build); Netlify serves
# dist/ directly and routes /.netlify/functions/* to the serverless functions.
