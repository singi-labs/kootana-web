[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA-style 404 fallback is not needed (static multi-file build); Netlify serves
# dist/ directly and routes /.netlify/functions/* to the serverless functions.

# AT Protocol OAuth client metadata for the Kootana native app. Authorization
# servers fetch it server-side; keep the cache short so changes propagate.
[[headers]]
  for = "/oauth/client-metadata.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=300"
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"
